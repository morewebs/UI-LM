[workspace]
resolver = "2"
members = ["crates/frames", "crates/capture", "crates/validate", "crates/pages", "crates/render", "crates/serve", "crates/model"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
