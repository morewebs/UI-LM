name: Release

# Binaries for people who do not have a Rust toolchain.
#
# A tag push (`v0.1.0`) builds all three programs on all three platforms and attaches
# archives to that release. A manual run does the same against a draft, so a release can be
# checked before it is announced: run it, download an asset, try it, then publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as (for example v0.1.0). Manual runs create a draft."
        required: true

# Only this workflow may write to the repository, and only because it attaches assets to a
# release. Every other workflow stays read-only.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --workspace

      # Archived per platform with a name a person can tell apart at a glance.
      - name: archive (unix)
        if: runner.os != 'Windows'
        run: |
          # The model travels with the binaries, as on Windows.
          mkdir -p "ui-lm-${RUNNER_ARCH}/models"
          cp models/page.json "ui-lm-${RUNNER_ARCH}/models/page.json"
          cp target/release/ui-lm-capture target/release/ui-lm-serve target/release/ui-lm-validate "ui-lm-${RUNNER_ARCH}/"
          tar -czf "$GITHUB_WORKSPACE/ui-lm-${{ runner.os }}-${RUNNER_ARCH}.tar.gz" "ui-lm-${RUNNER_ARCH}"
      - name: archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The model travels with the binaries. A download without it cannot score a screen or
          # describe one: `score` and `serve` both want `models/page.json`, and a first-time
          # user had to find that file in the repository before the model would run at all.
          New-Item -ItemType Directory -Force -Path "ui-lm-$env:RUNNER_ARCH/models" | Out-Null
          Copy-Item "models/page.json" "ui-lm-$env:RUNNER_ARCH/models/page.json"
          Copy-Item "target/release/ui-lm-capture.exe" "ui-lm-$env:RUNNER_ARCH/"
          Copy-Item "target/release/ui-lm-serve.exe" "ui-lm-$env:RUNNER_ARCH/"
          Copy-Item "target/release/ui-lm-validate.exe" "ui-lm-$env:RUNNER_ARCH/"
          Compress-Archive -Path "ui-lm-$env:RUNNER_ARCH" `
            -DestinationPath "ui-lm-Windows-$env:RUNNER_ARCH.zip"

      # The same `gh` the repository is administered with, and no third-party action that
      # would need its own review.
      - name: attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          $assets = Get-ChildItem -Path . -File | Where-Object { $_.Name -like 'ui-lm-*' }
          $existing = gh release view $env:TAG --json tagName --jq .tagName 2>$null
          if (-not $existing) {
            $flags = @('--title', $env:TAG, '--notes', "Built from $env:GITHUB_SHA.")
            if ($env:DRAFT -eq 'true') { $flags += '--draft' }
            gh release create $env:TAG @flags
          }
          foreach ($asset in $assets) { gh release upload $env:TAG $asset.FullName --clobber }
          gh release view $env:TAG --json url --jq .url
